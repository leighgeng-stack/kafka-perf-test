stages:
  - build
  - package
  - deploy

variables:
  TARGET_NAMESPACE: kafka-perf-test
  CI_REGISTRY_SECRET_NM: nxregsecret
  TARGET_APP_NAME: kafka-perf-runner
  CI_REGISTRY_IMAGE_CLI: "$CI_REGISTRY_HOSTED/kafka-perf/kafka-perf-runner"
  CI_REGISTRY_IMAGE_SPRING: "$CI_REGISTRY_HOSTED/kafka-perf/kafka-perf-spring"

# Build Spring runner (Gradle)
spring-build:
  stage: build
  image: $CI_REGISTRY_HUB/gradle:8.7-jdk21
  before_script:
    - export SPRING_PROFILES_ACTIVE=test
  script:
    - cd runners/spring
    - gradle clean build
  artifacts:
    name: kafka_perf_spring_build
    expire_in: 2 day
    paths:
      - runners/spring/build/libs/*.jar
  tags:
    - $CI_WORKER_TAG

# Containerize and push both runners to Nexus
containerize:
  stage: package
  image: 
    name: $CI_REGISTRY_HUB/docker:latest
    entrypoint: [""]
  variables:
    DOCKER_HOST: tcp://docker:2375 
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: ""
    TARGET_PLATFORM: "linux/amd64"
  services:
    - name: docker:dind
      alias: docker
      command: ["--tls=false"]
  before_script:
    - echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER $CI_REGISTRY_HOSTED --password-stdin
    # Enable binfmt for cross-building and setup buildx
    - docker run --privileged --rm tonistiigi/binfmt --install arm64,amd64
    - docker buildx create --use || true
    - docker buildx version
  script:
    # Build and push CLI runner (arch-specific)
    - docker buildx build --platform "$TARGET_PLATFORM" -f runners/cli/docker/Dockerfile .
      -t $CI_REGISTRY_IMAGE_CLI:$CI_COMMIT_TAG 
      -t $CI_REGISTRY_IMAGE_CLI:latest 
      --push
    
    # Build and push Spring runner (arch-specific)
    - docker buildx build --platform "$TARGET_PLATFORM" -f runners/spring/docker/Dockerfile .
      -t $CI_REGISTRY_IMAGE_SPRING:$CI_COMMIT_TAG 
      -t $CI_REGISTRY_IMAGE_SPRING:latest 
      --push
  rules:
    - if: $CI_COMMIT_TAG =~ /^v(?:\d+.){2}(?:\d+)$/
  tags:
    - $CI_WORKER_TAG

# Deploy to Kubernetes via Helm
deploy:
  stage: deploy
  image: $CI_REGISTRY_HUB/alpine/k8s:1.23.16
  before_script:
    - chmod 600 $KUBE_CONFIG_FILE
    - export KUBECONFIG=$KUBE_CONFIG_FILE
    - if ! helm ls -n $TARGET_NAMESPACE | grep -q $TARGET_APP_NAME; then
        echo "Creating namespace and secret for the first-time installation...";
        kubectl create namespace $TARGET_NAMESPACE --dry-run=client -o yaml | kubectl apply -f -;
        kubectl create secret docker-registry $CI_REGISTRY_SECRET_NM --docker-server=$CI_REGISTRY_HOSTED  --docker-email=$CI_REGISTRY_USER_EMAIL --docker-username=$CI_REGISTRY_USER --docker-password=$CI_REGISTRY_PASSWORD --namespace=$TARGET_NAMESPACE --dry-run=client -o yaml | kubectl apply -f -;
      fi
  script:
    - if helm ls -n $TARGET_NAMESPACE | grep -q $TARGET_APP_NAME; then
        echo "Upgrading the existing release...";
        helm upgrade $TARGET_APP_NAME charts/kafka-perf-runner -n $TARGET_NAMESPACE \
          --set image.repository=$CI_REGISTRY_IMAGE_CLI \
          --set image.tag=$CI_COMMIT_TAG \
          --set bootstrapServers=$KAFKA_BOOTSTRAP_SERVERS;
      else
        echo "Installing a new release...";
        helm install $TARGET_APP_NAME charts/kafka-perf-runner -n $TARGET_NAMESPACE \
          --set image.repository=$CI_REGISTRY_IMAGE_CLI \
          --set image.tag=$CI_COMMIT_TAG \
          --set bootstrapServers=$KAFKA_BOOTSTRAP_SERVERS;
      fi
  rules:
    - if: $CI_COMMIT_TAG =~ /^v(?:\d+.){2}(?:\d+)$/
      allow_failure: false
  environment:
    name: lab
  tags:
    - $CI_WORKER_TAG

