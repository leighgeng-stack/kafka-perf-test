services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka-baseline-broker
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: "BROKER://:9092,BROKER_INTERNAL://:9094,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "BROKER://localhost:9092,BROKER_INTERNAL://kafka:9094"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "BROKER:PLAINTEXT,BROKER_INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "BROKER_INTERNAL"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_LOG_DIRS: "/tmp/kraft-combined-logs"
      KAFKA_CLUSTER_ID: ${KAFKA_CLUSTER_ID:-4L6g3nShT-eMCtK--X86sw}

  perf-runner:
    build:
      context: .
      dockerfile: runners/cli/docker/Dockerfile
      args:
        KAFKA_VERSION: ${KAFKA_VERSION:-3.8.0}
        SCALA_VERSION: ${SCALA_VERSION:-2.13}
    image: kafka-perf-runner:local
    container_name: kafka-perf-runner
    working_dir: /workspace/runners/cli
    volumes:
      - .:/workspace
    environment:
      BOOTSTRAP_SERVERS: ${BOOTSTRAP_SERVERS:-kafka:9094}
    depends_on:
      - kafka

  spring-runner:
    build:
      context: .
      dockerfile: runners/spring/docker/Dockerfile
    image: kafka-perf-spring:local
    container_name: kafka-perf-spring
    working_dir: /workspace
    environment:
      BOOTSTRAP_SERVERS: ${BOOTSTRAP_SERVERS:-kafka:9094}
      ARTIFACTS_DIR: /workspace/artifacts
    volumes:
      - .:/workspace
    depends_on:
      - kafka

